# main에 올리면 공개 주소에 자동 배포, PR에는 미리보기 주소를 만든다.
name: Firebase Hosting 배포

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deploy:
    # 포크에서 온 PR에는 비밀 값이 없으므로 건너뛴다.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLUE_NABY_GAME }}
          projectId: blue-naby-game
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
