<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>블루나비 캐릭터 시트</title>
<style>
  @font-face { font-family: 'Jua'; src: url('../public/fonts/Jua-subset.woff2') format('woff2'); }
  @font-face { font-family: 'Gowun Dodum'; src: url('../public/fonts/GowunDodum-subset.woff2') format('woff2'); }
  body { margin: 0; padding: 28px; background: #f3e3c3; color: #2b2d5a; font-family: 'Gowun Dodum', sans-serif; }
  h1 { font: 44px 'Jua', sans-serif; margin: 0 0 4px; }
  p { margin: 0 0 20px; }
  section { display: flex; gap: 16px; margin-bottom: 16px; }
  .light { flex: 1; display: flex; align-items: flex-end; gap: 14px; background: #fffaf0; border-radius: 28px; padding: 18px 22px; }
  .dark { width: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #23254d; color: #ffe9a8; border-radius: 28px; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 18px; margin-top: 4px; }
  .hero figcaption { font: 30px 'Jua', sans-serif; }
  .sizes div { display: flex; align-items: flex-end; gap: 10px; height: 120px; }
</style></head><body>
<h1>블루나비 캐릭터 시트</h1>
<p>애벌레 → 나방 → 나비. 얼굴(눈·볼·입)은 세 모습이 같은 모양을 써서 진화해도 같은 블루나비로 보이게 했어요.</p>
<section><div class="light"><figure class="hero"><img src="source/blue_caterpillar.svg" width="240" height="240" alt=""><figcaption>애벌레</figcaption></figure><figure><img src="source/blue_caterpillar_joy.svg" width="120" height="120" alt=""><figcaption>기쁨</figcaption></figure><figure><img src="source/blue_caterpillar_surprise.svg" width="120" height="120" alt=""><figcaption>놀람</figcaption></figure><figure><img src="source/blue_caterpillar_sleepy.svg" width="120" height="120" alt=""><figcaption>졸림</figcaption></figure><figure><img src="source/blue_caterpillar_sad.svg" width="120" height="120" alt=""><figcaption>시무룩</figcaption></figure><figure class="sizes"><div><img src="source/blue_caterpillar.svg" width="64" height="64" alt=""><img src="source/blue_caterpillar.svg" width="32" height="32" alt=""></div><figcaption>미로 크기 64 · 32</figcaption></figure></div><div class="dark"><img src="source/blue_caterpillar.svg" width="120" height="120" alt=""><span>밤 바탕</span></div></section>
<section><div class="light"><figure class="hero"><img src="source/blue_moth.svg" width="240" height="240" alt=""><figcaption>나방</figcaption></figure><figure><img src="source/blue_moth_joy.svg" width="120" height="120" alt=""><figcaption>기쁨</figcaption></figure><figure><img src="source/blue_moth_surprise.svg" width="120" height="120" alt=""><figcaption>놀람</figcaption></figure><figure><img src="source/blue_moth_sleepy.svg" width="120" height="120" alt=""><figcaption>졸림</figcaption></figure><figure><img src="source/blue_moth_sad.svg" width="120" height="120" alt=""><figcaption>시무룩</figcaption></figure><figure class="sizes"><div><img src="source/blue_moth.svg" width="64" height="64" alt=""><img src="source/blue_moth.svg" width="32" height="32" alt=""></div><figcaption>미로 크기 64 · 32</figcaption></figure></div><div class="dark"><img src="source/blue_moth.svg" width="120" height="120" alt=""><span>밤 바탕</span></div></section>
<section><div class="light"><figure class="hero"><img src="source/blue_butterfly.svg" width="240" height="240" alt=""><figcaption>나비</figcaption></figure><figure><img src="source/blue_butterfly_joy.svg" width="120" height="120" alt=""><figcaption>기쁨</figcaption></figure><figure><img src="source/blue_butterfly_surprise.svg" width="120" height="120" alt=""><figcaption>놀람</figcaption></figure><figure><img src="source/blue_butterfly_sleepy.svg" width="120" height="120" alt=""><figcaption>졸림</figcaption></figure><figure><img src="source/blue_butterfly_sad.svg" width="120" height="120" alt=""><figcaption>시무룩</figcaption></figure><figure class="sizes"><div><img src="source/blue_butterfly.svg" width="64" height="64" alt=""><img src="source/blue_butterfly.svg" width="32" height="32" alt=""></div><figcaption>미로 크기 64 · 32</figcaption></figure></div><div class="dark"><img src="source/blue_butterfly.svg" width="120" height="120" alt=""><span>밤 바탕</span></div></section>
</body></html>
