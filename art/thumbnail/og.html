<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}
@font-face{font-family:Gowun;src:url(../../public/fonts/GowunDodum-subset.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1372px;height:720px;overflow:hidden;position:relative;background:#8a6248}
.bg{position:absolute;left:0;top:0;width:1372px;height:720px}
.card{position:absolute;left:690px;width:630px;top:70px;background:#fffaf0;border:7px solid #2b2d5a;border-radius:38px;box-shadow:0 10px 0 rgba(43,45,90,.35);padding:30px 26px 30px;text-align:center;font-family:Jua;color:#2b2d5a}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.chip{font-size:32px;color:#fff;border:5px solid #2b2d5a;border-radius:999px;padding:3px 18px 6px;line-height:1}
.c1{background:#2f7bff}.c2{background:#ff9fb8}
.name{font-size:52px;line-height:1.15;white-space:nowrap}
.n1{color:#2f7bff}.n2{color:#e0557a}
.amp{font-size:44px;margin:4px 0 2px;line-height:1}
.kick{font-family:Gowun;font-size:27px;color:#5a5c88}
.big{font-family:Jua;font-size:66px;line-height:1.15;margin-top:8px;white-space:nowrap}
.sub2{font-family:Jua;font-size:32px;margin-top:14px}
.sub2 .chip{font-size:28px;vertical-align:3px}
.link{position:absolute;left:715px;top:470px;display:flex;align-items:center;gap:14px;font-family:Jua;font-size:40px;color:#2b2d5a;background:#fff;border:6px solid #2b2d5a;border-radius:999px;padding:8px 28px 12px 12px;box-shadow:0 7px 0 #2b2d5a}
.link i{display:block;width:56px;height:56px;border-radius:50%;background:#ff6b5b;position:relative;flex:none}
.link i:after{content:'';position:absolute;left:21px;top:15px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.by{position:absolute;left:730px;top:592px;font-family:Jua;font-size:38px;color:#2b2d5a}
.by small{font-family:Gowun;font-size:28px;color:#5a5c88;margin-right:10px}
.ch{position:absolute;filter:drop-shadow(0 8px 0 rgba(43,45,90,.18))}
</style></head><body>
<img class="bg" src="entry_land.png">
<img class="ch" src="blue_butterfly.png" style="height:190px;left:70px;top:330px;rotate:-10deg">
<img class="ch" src="blue_popoSpring.png" style="height:200px;left:520px;top:450px">
<div class="card">
  <div class="kick">설치 없이 링크로 바로 하는 미로 모험</div>
  <div class="big"><span class="n1">블루나비</span>와 <span class="n2">포포</span>의 여행</div>
  <div class="sub2"><b class="chip c1">1탄</b> 세계여행 &nbsp; <b class="chip c2">2탄</b> 사계절 서울</div>
</div>
<div class="link"><i></i>blue-naby-game.web.app</div>
<div class="by"><small>만든 사람</small>장은영(블루나비)</div>
</body></html>
