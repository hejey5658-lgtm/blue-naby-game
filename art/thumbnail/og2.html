<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}

*{margin:0;box-sizing:border-box}
body{width:1372px;height:720px;overflow:hidden;position:relative;background:#8f6440}

.bg{position:absolute;left:0;top:0;width:1372px;height:720px}
.card{position:absolute;left:930px;top:132px;width:400px;background:#fffaf0;border:7px solid #2b2d5a;border-radius:36px;box-shadow:0 10px 0 rgba(43,45,90,.3);padding:26px 18px 28px;text-align:center;font-family:Jua;color:#2b2d5a}

.link i{display:block;width:44px;height:44px;border-radius:50%;background:#ff6b5b;position:relative;flex:none}
