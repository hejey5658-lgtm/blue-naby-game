<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#8f6440}
/* 카카오톡 미리보기 (2026-11-11~): 게임 첫 화면(지구본 입구)의 **가로 화면** 그대로 + 오른쪽 아래 버전 알약.
   바탕 entry_land_og.png = 852×447 가로 폰 화면(캔버스 1372×720, 1200×630과 같은 비율, 버전 글자만 숨김) */
.shot{position:absolute;left:0;top:0;width:1200px;height:630px}
.ver{position:absolute;right:22px;bottom:18px;font-family:Jua;font-size:28px;color:#2b2d5a;background:#fffaf0;border:4px solid #2b2d5a;border-radius:999px;padding:3px 18px 5px;box-shadow:0 5px 0 #2b2d5a}
</style></head><body><img class="shot" src="entry_land_og.png"><div class="ver" id="ver"></div>
<script>/* 버전 글자: build-thumbnail.cjs 가 #v=버전 으로 넘김 */document.getElementById("ver").textContent="v"+(new URLSearchParams(location.hash.slice(1)).get("v")||"");</script>
</body></html>
