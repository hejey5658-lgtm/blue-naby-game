<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}
@font-face{font-family:Gowun;src:url(../../public/fonts/GowunDodum-subset.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:2340px;overflow:hidden;position:relative;background:#6cc35a}
/* 바탕 = 실제 게임 홈 화면(v3.8.0, 720×1560을 1.5배) — 버전 글자만 숨겨 찍음 (art/thumbnail/home_clean.png) */
.bg{position:absolute;left:0;top:0;width:1080px;height:2340px}
.kick{position:absolute;left:50%;transform:translateX(-50%);top:70px;white-space:nowrap;font-family:Jua;font-size:44px;color:#2b2d5a;background:rgba(255,255,255,.92);border-radius:999px;padding:10px 34px 14px}
.link{position:absolute;left:50%;transform:translateX(-50%);top:2040px;display:flex;align-items:center;gap:18px;font-family:Jua;font-size:56px;color:#2b2d5a;background:#fff;border:7px solid #2b2d5a;border-radius:999px;padding:12px 40px 16px 16px;box-shadow:0 9px 0 #2b2d5a;white-space:nowrap}
.link i{display:block;width:76px;height:76px;border-radius:50%;background:#ff6b5b;position:relative;flex:none}
.link i:after{content:'';position:absolute;left:29px;top:20px;border-left:30px solid #fff;border-top:18px solid transparent;border-bottom:18px solid transparent}
.by{position:absolute;left:50%;transform:translateX(-50%);top:2196px;white-space:nowrap;font-family:Jua;font-size:50px;color:#fff;background:#2b2d5a;border-radius:999px;padding:12px 40px 16px}
.by small{font-family:Gowun;font-size:36px;margin-right:14px;color:#cfe3ff}
</style></head><body>
<img class="bg" src="home_clean.png">
<div class="kick">설치 없이 링크로 바로 하는 미로 모험</div>
<div class="link"><i></i>blue-naby-game.web.app</div>
<div class="by"><small>만든 사람</small>장은영(블루나비)</div>
</body></html>
