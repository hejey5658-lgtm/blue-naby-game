<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}
@font-face{font-family:Gowun;src:url(../../public/fonts/GowunDodum-subset.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:2340px;overflow:hidden;position:relative;background:#8a6248}
.bg{position:absolute;left:0;top:0;width:1080px;height:2340px}
.card{position:absolute;left:50px;right:50px;top:70px;background:#fffaf0;border:8px solid #2b2d5a;border-radius:44px;box-shadow:0 12px 0 rgba(43,45,90,.35);padding:44px 40px 40px;text-align:center;font-family:Jua;color:#2b2d5a}
.row{display:flex;align-items:center;justify-content:center;gap:22px}
.chip{font-size:46px;color:#fff;border:6px solid #2b2d5a;border-radius:999px;padding:4px 26px 8px;line-height:1}
.c1{background:#2f7bff}.c2{background:#ff9fb8}
.name{font-size:80px;line-height:1.15;white-space:nowrap}
.n1{color:#2f7bff}.n2{color:#e0557a}
.amp{font-size:64px;color:#2b2d5a;margin:8px 0 6px;line-height:1}
.sub{font-family:Gowun;font-size:38px;color:#5a5c88;margin-top:26px}
.link{position:absolute;left:60px;top:1838px;display:flex;align-items:center;gap:18px;font-family:Jua;font-size:52px;color:#2b2d5a;background:#fff;border:7px solid #2b2d5a;border-radius:999px;padding:12px 36px 16px 16px;box-shadow:0 9px 0 #2b2d5a}
.link i{display:block;width:72px;height:72px;border-radius:50%;background:#ff6b5b;position:relative;flex:none}
.link i:after{content:'';position:absolute;left:27px;top:19px;border-left:28px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent}
.by{position:absolute;left:70px;top:2010px;font-family:Jua;font-size:50px;color:#2b2d5a}
.by small{font-family:Gowun;font-size:36px;color:#5a5c88;margin-right:14px}
.ch{position:absolute;filter:drop-shadow(0 10px 0 rgba(43,45,90,.18))}
.foot{position:absolute;left:0;right:0;top:2252px;text-align:center;font-family:Jua;font-size:40px;color:#fff3dc}
</style></head><body>
<img class="bg" src="entry_clean.png">
<div class="card">
  <div class="row"><span class="chip c1">1탄</span><span class="name n1">블루나비의 세계여행</span></div>
  <div class="amp">&amp;</div>
  <div class="row"><span class="chip c2">2탄</span><span class="name n2">포포의 사계절 서울여행</span></div>
  <div class="sub">미로 모험 · 숨바꼭질 친구 · 기념품 퐁퐁</div>
</div>
<img class="ch" src="blue_butterfly.png" style="height:250px;left:24px;top:1040px;rotate:-10deg">
<img class="ch" src="blue_popoSpring.png" style="height:270px;right:16px;top:1190px">
<div class="link"><i></i>blue-naby-game.web.app</div>
<div class="by"><small>만든 사람</small>장은영(블루나비)</div>
<div class="foot">설치 없이 링크로 바로!</div>
</body></html>
