@font-face{font-family:Jua;src:url(../../public/fonts/Jua-subset.woff2)}

*{margin:0;box-sizing:border-box}
body{--dy:0px;width:1280px;height:720px;overflow:hidden;position:relative;background:linear-gradient(#7cc2ff,#cfeaff 62%,#eaf6ff)}
.abs{position:absolute}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95}
.title{position:absolute;left:0;right:0;top:46px;text-align:center;font-family:Jua;color:#2b2d5a;paint-order:stroke fill;-webkit-text-stroke:16px #fff;line-height:1}
.t1{font-size:70px;color:#2f7bff}
.t2{font-size:168px;margin-top:4px;letter-spacing:2px}
.pill{position:absolute;left:50%;transform:translateX(-50%);top:302px;font-family:Jua;font-size:34px;color:#fff;background:#2f7bff;border:5px solid #2b2d5a;border-radius:999px;padding:8px 30px 10px;white-space:nowrap;box-shadow:0 6px 0 #2b2d5a}
.pill b{color:#ffd84a;font-weight:normal}
img{position:absolute}
.f{height:96px;bottom:20px;filter:drop-shadow(0 4px 0 rgba(43,45,90,.18))}
body.og{--dy:48px;height:672px}
body.og .qr{display:none}
.title{top:calc(46px - var(--dy) * .45)}
.pill{top:calc(302px - var(--dy) * .6)}
.dy{transform:translateY(calc(-1 * var(--dy)))}
.link{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:10px;font-family:Jua;font-size:30px;color:#2b2d5a;background:#fff;border:5px solid #2b2d5a;border-radius:999px;padding:6px 22px 8px 10px;box-shadow:0 5px 0 #2b2d5a}
.link i{display:block;width:40px;height:40px;border-radius:50%;background:#ff6b5b;position:relative}
.link i:after{content:'';position:absolute;left:15px;top:11px;border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.qr{position:absolute;right:26px;top:22px;background:#fff;border:5px solid #2b2d5a;border-radius:18px;padding:8px 8px 4px;text-align:center;font-family:Jua;font-size:20px;color:#2b2d5a;box-shadow:0 5px 0 #2b2d5a}
.qr img{position:static;display:block;width:132px;height:132px}
</style></head><body class="">
