<!doctype html><html><head><meta charset="utf-8"><style>
/* 리플렛용 메인 그림 23×41mm (2026-11-17): 캐나다 틀린그림 두 그림 + 게임 제목. 730×1301 = 23:41 */
@font-face{font-family:Jua;src:url(../../../public/fonts/Jua-subset.woff2)}
*{margin:0;box-sizing:border-box}
body{width:730px;height:1301px;overflow:hidden;position:relative;font-family:Jua;color:#2b2d5a;
  background:linear-gradient(#bfe2ff 0,#dff0ff 230px,#fffaf0 330px,#fff3dc 100%)}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9}
.title{position:absolute;left:0;right:0;top:34px;text-align:center;line-height:1.02;font-size:104px;letter-spacing:-1px;
  -webkit-text-stroke:0;text-shadow:0 0 0 #fff}
.title span{display:block;paint-order:stroke fill;-webkit-text-stroke:16px #fffaf0}
.title b{font-weight:normal;color:#2f7bff}.title i{font-style:normal;color:#ff6f9a}
.title .s{position:absolute;inset:0}
.sub{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:30px;color:#fff}
.sub em{font-style:normal;background:#2f7bff;padding:5px 18px 8px;border-radius:99px;box-shadow:0 4px 0 #1f5fd6}
.chr{position:absolute;top:20px;width:118px;filter:drop-shadow(0 4px 0 rgba(43,45,90,.18))}
.pic{position:absolute;left:17px;width:696px;height:487px}
</style></head><body>
<div class="cloud" style="left:-30px;top:40px;width:170px;height:56px"></div>
<div class="cloud" style="right:-20px;top:120px;width:150px;height:50px"></div>
<img class="chr" src="../../../art/thumbnail/blue_butterfly.png" style="left:2px;top:168px;width:104px">
<img class="chr" src="../../../art/thumbnail/blue_popoSpring.png" style="right:0;top:160px;width:112px">
<div class="title"><span><b>블루나비</b>와</span><span><i>포포</i>의 여행</span></div>
<div class="sub"><em>다른 곳을 톡! 찾아봐요</em></div>
<img class="pic" src="canada-spot-A.png" style="top:322px">
<img class="pic" src="canada-spot-B.png" style="top:810px">
</body></html>
