<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e9d8b4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="블루나비" />
    <title>블루나비의 세계여행</title>
    <meta name="description" content="파란 애벌레 블루나비가 한국에서 캐나다까지 여행하며 나비가 되는 귀여운 모험" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- 카카오톡·SNS 링크 미리보기 (web-release 6절). 카카오톡은 미리보기를 한동안 저장해 둔다 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="블루나비의 세계여행" />
    <meta property="og:title" content="블루나비의 세계여행" />
    <meta property="og:description" content="설치 없이 링크로 바로! 블루나비와 함께 세계여행을 떠나요" />
    <meta property="og:image" content="https://blue-naby-game.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://blue-naby-game.web.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/Jua-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GowunDodum-subset.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* 글꼴: 제목·버튼 주아(Jua), 대사·설명 고운돋움(Gowun Dodum). 둘 다 SIL OFL 1.1, public/fonts/OFL-*.txt */
      @font-face { font-family: 'Jua'; src: url('/fonts/Jua-subset.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Gowun Dodum'; src: url('/fonts/GowunDodum-subset.woff2') format('woff2'); font-display: swap; }
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --ink: #2b2d5a;
        --theme: #e9d8b4;
        --theme-bottom: #f3e3c3;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(var(--theme) 50%, var(--theme-bottom) 50%);
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }

      /* 폰을 가로로 들었을 때만 보이는 덮개 */
      #rotate {
        position: fixed; inset: 0; z-index: 10;
        display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: var(--theme); color: var(--ink);
        font: 24px/1.4 'Jua', "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        text-align: center; padding: 16px;
      }
      #rotate.show { display: flex; }
      #rotate svg { width: 88px; height: 88px; animation: tilt 1.6s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
      @keyframes tilt { from { transform: rotate(-90deg); } to { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" role="alert" aria-live="polite">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="18" y="6" width="28" height="52" rx="7" fill="#7ec8ff" stroke="#2b2d5a" stroke-width="3.5" />
        <circle cx="32" cy="50" r="3" fill="#2b2d5a" />
        <circle cx="27" cy="24" r="2.6" fill="#2b2d5a" />
        <circle cx="37" cy="24" r="2.6" fill="#2b2d5a" />
        <ellipse cx="24" cy="31" rx="3" ry="2" fill="#ff9fb8" />
        <ellipse cx="40" cy="31" rx="3" ry="2" fill="#ff9fb8" />
      </svg>
      <div>폰을 세워 주세요<br /><span style="font: 17px/1.5 'Gowun Dodum', system-ui, sans-serif; opacity:.8">블루나비는 세로 화면에서 놀아요</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
